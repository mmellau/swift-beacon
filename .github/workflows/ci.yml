name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE', 'Assets/**', '.editorconfig', '.spi.yml']
  pull_request:
    paths-ignore: ['README.md', 'LICENSE', 'Assets/**', '.editorconfig', '.spi.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: set -o pipefail && xcodebuild build -scheme Beacon -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" | xcbeautify --renderer github-actions
      - name: Test
        run: set -o pipefail && xcodebuild test -scheme Beacon -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro" | xcbeautify --renderer github-actions
